name: Plurk Realtime Integration Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realtime-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run realtime test
        env:
          PLURK_APP_KEY: ${{ secrets.PLURK_APP_KEY }}
          PLURK_APP_SECRET: ${{ secrets.PLURK_APP_SECRET }}
          PLURK_TOKEN: ${{ secrets.PLURK_TOKEN }}
          PLURK_TOKEN_SECRET: ${{ secrets.PLURK_TOKEN_SECRET }}
        run: python realtime_test.py
